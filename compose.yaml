name: search

services:
  backend:
    container_name: maggot
    build:
      context: ./backend
      dockerfile: Dockerfile.server
    init: true
    ports:
      - "8080:8080"
    volumes:
      - ./backend/src/main/resources/config.properties:/app/config.properties
      - ./backend/data:/app/data
    depends_on:
      db:
        condition: service_started
      redis1:
        condition: service_healthy
      redis2:
        condition: service_healthy

  db:
    container_name: mongrel
    image: mongo:8.3
    logging:
      driver: "none"
    #    command: [
    #      "--wiredTigerCollectionBlockCompressor", "zstd",
    #      "--wiredTigerJournalCompressor", "zstd",
    #      "--journalCommitInterval", "500"
    #    ]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb

  redis1:
    container_name: wench
    image: redis:8.8-alpine
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli info persistence | grep -q '^loading:0'" ]
      interval: 1m30s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s
    ports:
      - "6379:6379"
    volumes:
      - redis_data1:/data

  redis2:
    container_name: wretch
    image: redis:8.8-alpine
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli info persistence | grep -q '^loading:0'" ]
      interval: 1m30s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s
    ports:
      - "6380:6379"
    volumes:
      - redis_data2:/data

volumes:
  mongo_data:
  mongo_config:
  redis_data1:
  redis_data2: