<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/svg.css">
  <link rel="stylesheet" href="styles/search.css">
  <link rel="stylesheet" href="styles/dropdown.css">
  <link rel="stylesheet" href="styles/results.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sorts+Mill+Goudy&display=swap" rel="stylesheet">
</head>

<body>
  <header class="header">
    <h1>Skopos</h1>
  </header>

  <main class="page-layout">
    <search class="search-container">
      <form class="search-form" action="" method="get" role="search">
        <input type="search" name="query" placeholder="Search..." aria-label="Search query" autocomplete="off">
      </form>
    </search>

    <div class="table-container" data-table-container hidden>
      <div class="table-toolbar">
        <details class="column-filter">
          <summary class="btn" data-filter-trigger aria-haspopup="menu">
            <span data-filter-count></span>
            <span class="icon icon-lg icon-chevron-down" aria-hidden="true"></span>
          </summary>

          <div class="filter-menu" data-filter-menu role="menu">
            <div class="filter-search">
              <input type="search" class="filter-search-input" aria-label="Filter columns" placeholder="Filter...">
            </div>
            <label class="filter-select-all">
              <input type="checkbox">
              <span>Select all</span>
            </label>
            <div class="filter-options" data-filter-options></div>
          </div>
        </details>
      </div>

      <div class="table-frame" data-table-frame>
        <div class="table-wrapper" tabindex="0" role="region" aria-label="Data Table">
          <table class="output-table" aria-live="polite">
            <thead data-table-head></thead>
            <tbody data-table-body></tbody>
          </table>
        </div>
      </div>

      <nav class="pagination-container" aria-label="Pagination"></nav>
    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>

</html>
