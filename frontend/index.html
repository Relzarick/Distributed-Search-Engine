<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="search.css">
  <link rel="stylesheet" href="results.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sorts+Mill+Goudy&display=swap" rel="stylesheet">
</head>

<body>
  <header class="header">
    <h1>Skopos</h1>
    <p class="subtitle">Distributed Search Engine</p>
  </header>

  <main class="search-container">
    <form class="search-form" role="search">
      <input type="search" name="query" placeholder="Search..." aria-label="Search query">
    </form>

    <div class="table-container" id="table-container" style="display: none;">
      <div class="table-toolbar">
        <div class="column-filter">
          <button type="button" id="filter-btn" class="btn borderless-btn" aria-haspopup="menu" aria-expanded="false">
            <span id="filter-count"></span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="m6 9 6 6 6-6" />
            </svg>
          </button>
          <div id="filter-menu" class="filter-menu" role="menu"></div>
        </div>
      </div>

      <div class="table-wrapper">
        <table class="output-table" aria-live="polite">
          <thead id="table-head"></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="main.js"></script>
</body>

</html>
