<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/search.css">
  <link rel="stylesheet" href="styles/dropdown.css">
  <link rel="stylesheet" href="styles/results.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sorts+Mill+Goudy&display=swap" rel="stylesheet">
</head>

<body>
  <header class="header">
    <h1>Skopos</h1>
  </header>

  <main class="search-container">
    <form class="search-form" role="search">
      <input type="search" name="query" placeholder="Search..." aria-label="Search query">
    </form>

    <div class="table-container" id="table-container" style="display: none;">
      <div class="table-toolbar">
        <div class="column-filter">
          <button type="button" id="filter-btn" class="btn" aria-haspopup="menu" aria-expanded="false">
            <span id="filter-count"></span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="m6 9 6 6 6-6" />
            </svg>
          </button>

          <div id="filter-menu" class="filter-menu" role="menu">
            <div class="filter-search">
              <input type="search" class="filter-search-input" aria-label="Filter columns">
            </div>
            <label class="filter-select-all">
              <input type="checkbox">Select all</label>
            <div id="filter-options"></div>
          </div>
        </div>
      </div>

      <div class="table-frame">
        <div class="table-wrapper">
          <table class="output-table" aria-live="polite">
            <thead id="table-head"></thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
      </div>

      <div class="pagination-container">
        <button type="button" class="pagination-btn" aria-label="First Page">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="m11 17-5-5 5-5" />
            <path d="m18 17-5-5 5-5" />
          </svg>
        </button>

        <button type="button" class="pagination-btn" aria-label="Previous Page">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6" />
          </svg>
        </button>

        <button type="button" class="pagination-btn active">1</button>
        <button type="button" class="pagination-btn">2</button>
        <button type="button" class="pagination-btn">3</button>

        <button type="button" class="pagination-btn" aria-label="Next Page">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6" />
          </svg>
        </button>

        <button type="button" class="pagination-btn" aria-label="Last Page">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="m6 17 5-5-5-5" />
            <path d="m13 17 5-5-5-5" />
          </svg>
        </button>
      </div>
    </div>
  </main>

  <script src="search.js"></script>
  <script src="results.js"></script>
  <script src="filter.js"></script>
  <script src="pagination.js"></script>
  <script src="app.js"></script>
</body>

</html>
